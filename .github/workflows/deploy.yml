name: Deploy to GitHub Pages
on:
  push:
    branches: [dev]
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        # Pinned to match local (9.15.9). pnpm 10 (what `latest` now resolves to)
        # blocks dependency build scripts by default and exits non-zero
        # (ERR_PNPM_IGNORED_BUILDS for esbuild/@swc/core), failing the install.
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Display Versions
        run: |
          node --version
          pnpm --version
          rustc --version
          wasm-pack --version
          cargo --version

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test (native core)
        run: |
          cargo test -p game-of-life-core --target "$(rustc -vV | sed -n 's/^host: //p')"

      # `game_of_life` (CPU Universe) is dormant, no longer built here: nothing
      # in app/ consumes it (the static-fallback renderer superseded it).
      # See Makefile CRATE_CPU comment + docs/interface-audit-2026-07.md Part 1 #2.

      - name: Build WASM (GPU)
        run: wasm-pack build crates/game_of_life_gpu --target bundler

      # Surface changes to the generated public TypeScript boundary (audit Part 1
      # #1): the committed high-level game_of_life_gpu.d.ts vs what wasm-pack just
      # produced. ADVISORY (warns, never fails) — a byte-exact gate needs the
      # wasm-bindgen CLI pinned local<->CI first, else toolchain drift in the
      # generated glue produces false failures. The `*_bg.wasm.d.ts` glue typings
      # are deliberately untracked (version-mangled symbol names, not an API).
      - name: Check WASM TS boundary (.d.ts) [advisory]
        run: |
          rm -f crates/game_of_life_gpu/pkg/.gitignore
          if ! git diff --exit-code -- crates/game_of_life_gpu/pkg/game_of_life_gpu.d.ts; then
            echo "::warning::The generated public WASM .d.ts differs from the committed copy (review the diff above and commit an updated crates/game_of_life_gpu/pkg/game_of_life_gpu.d.ts). Advisory until the wasm-bindgen CLI is pinned — see docs/interface-audit-2026-07.md Part 1 #1."
          fi

      - name: Install Dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: app
        run: pnpm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./app/dist
          publish_branch: main
