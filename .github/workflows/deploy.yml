name: Deploy to GitHub Pages
on:
  push:
    branches: [dev]
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        # Pinned to match local (9.15.9). pnpm 10 (what `latest` now resolves to)
        # blocks dependency build scripts by default and exits non-zero
        # (ERR_PNPM_IGNORED_BUILDS for esbuild/@swc/core), failing the install.
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Display Versions
        run: |
          node --version
          pnpm --version
          rustc --version
          wasm-pack --version
          cargo --version

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test (native core)
        run: |
          cargo test -p game-of-life-core --target "$(rustc -vV | sed -n 's/^host: //p')"

      - name: Build WASM (CPU)
        run: wasm-pack build crates/game_of_life --target bundler

      - name: Build WASM (GPU)
        run: wasm-pack build crates/game_of_life_gpu --target bundler

      # Gate the generated TypeScript boundary surface (audit Part 1 #1): the
      # committed .d.ts must match what wasm-pack just produced. A drift means a
      # #[wasm_bindgen] export changed without the reviewed .d.ts being updated.
      - name: Gate WASM TS boundary (.d.ts)
        run: |
          rm -f crates/game_of_life_gpu/pkg/.gitignore
          if ! git diff --exit-code -- crates/game_of_life_gpu/pkg/; then
            echo "::error::The generated WASM .d.ts (the public TS boundary) changed but the committed copy was not updated. Run a wasm-pack build and commit crates/game_of_life_gpu/pkg/*.d.ts. See docs/interface-audit-2026-07.md Part 1 #1."
            exit 1
          fi

      - name: Install Dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: app
        run: pnpm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./app/dist
          publish_branch: main
